# Child initiatives of initiative-carbontrack, in build order (architecture §11.3, adjusted by Decisions A and B).
# Table order is build order. `id` is permanent, never reused.

[[initiative]]
id = 1
slug = "initiative-plt-platform-foundation"
title = "Platform foundation (M0)"
description = "One command starts the app with demo sign-in, the app shell and organization switcher, and the shared error and page-state behavior every module uses. The seed command and demo users start here; factor and demo-data seeding join it in M3 and M2."
covers = ["R1", "R2", "R3", "R4", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R13", "R38"]

[[initiative]]
id = 2
slug = "initiative-org-company-management"
title = "Company management (M1)"
description = "Users create, list, switch and edit organizations and add and edit their reporting periods. The organization switcher's container is M0's. Headline figures and the period-edit guard are built later, in M3 and M2."
covers = ["R6", "R12", "R13", "R14", "R15", "R16"]
after = [{ initiative = 1, needs = "the app shell, sign-in and shared page states" }]

[[initiative]]
id = 3
slug = "initiative-emi-emissions-calculation"
title = "Emissions calculation (M3)"
description = "M3 builds the activity table and the calculation core and tests them directly: factors and their versions, calculation with history, the factor returned with every calculation, and totals by type and month. M2 then builds what users do with activities on top and calls the calculation in the same save. M3 also seeds factor version 1 and adds the organization's headline figures."
covers = ["R1", "R4", "R14", "R17", "R21", "R23", "R24", "R25", "R26", "R27", "R28", "R29", "R30", "R31", "R32", "R33"]
after = [{ initiative = 1, needs = "the platform foundation and seed command" }, { initiative = 2, needs = "reporting periods for totals per period" }]

[[initiative]]
id = 4
slug = "initiative-act-activity-data"
title = "Activity data (M2)"
description = "Users record, review, correct and delete activities on M3's activity table, with each save calling M3's calculation in the same transaction. M2 also refuses period edits that would strand activities, and seeds the demo organizations, periods and activities."
covers = ["R4", "R16", "R17", "R18", "R19", "R20", "R21", "R22", "R23", "R25", "R31", "R33"]
after = [{ initiative = 2, needs = "reporting periods to link activities to" }, { initiative = 3, needs = "the activity table and the calculation called on every save" }]

[[initiative]]
id = 5
slug = "initiative-dsh-dashboard"
title = "Dashboard (M4)"
description = "Summary cards, a monthly trend and a breakdown for the selected period, all from M3's aggregates, with text equivalents for every chart. Its empty state opens M2's add-activity form."
covers = ["R31", "R34", "R35", "R36", "R37", "R38", "R39", "R40"]
after = [{ initiative = 2, needs = "the organization's periods" }, { initiative = 3, needs = "totals and monthly aggregates" }, { initiative = 4, needs = "the add-activity form the empty state opens" }]

[[initiative]]
id = 6
slug = "initiative-rpt-reports"
title = "Reports (M5)"
description = "A period report with summary and line items, and full-precision CSV exports that carry the demonstration disclaimer, from M3's aggregates and M2's activity records."
covers = ["R25", "R31", "R33", "R41", "R42", "R43", "R44", "R45"]
after = [{ initiative = 3, needs = "totals and monthly aggregates" }, { initiative = 4, needs = "activity records for line items" }]
